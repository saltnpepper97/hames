[workspace]
members = ["crates/hames-repl"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
ratatui = "0.29.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
rustyline = "17.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tachyonfx = { version = "=0.19.0", default-features = false, features = ["std", "std-duration"] }
tokio = { version = "1.47", features = ["full"] }
toml = "0.9"
unicode-width = "0.2"
unicode-segmentation = "1.12"
